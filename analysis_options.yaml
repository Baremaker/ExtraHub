# Configuração de lints do ExtraHub.
#
# Partimos de `flutter_lints` e adicionamos regras específicas para evitar
# armadilhas comuns.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"          # arquivos gerados pelo build_runner
    - "**/*.freezed.dart"    # arquivos gerados pelo freezed
    - "lib/firebase_options.dart"   # gerado pelo flutterfire

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Avisos que devem virar erros (impedir compilação)
    invalid_annotation_target: ignore
    missing_required_param: error
    missing_return: error

linter:
  rules:
    # Boas práticas
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    avoid_print: true
    avoid_unused_constructor_parameters: true
    use_key_in_widget_constructors: true
    sort_pub_dependencies: false
    require_trailing_commas: true
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
